[project]
name = "concoct"
version = "0.1.0"
description = "Generate realistic synthetic software repositories with coherent, incremental Git histories."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Concoct contributors" }]
keywords = ["synthetic-data", "git", "code-generation", "llm", "claude", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=1,<2",
    "click>=8.1",
    "gitpython>=3.1.43",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pygithub>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
concoct = "concoct.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concoct"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
